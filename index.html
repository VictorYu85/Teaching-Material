<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Learning Hub & Interactive Topic Tree</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --blue: #3b82f6;
      --emerald: #10b981;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .brand-badge {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
    }
    .progress-bar-wrap {
      width: 80px;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #334155;
      border: 1px solid #475569;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #475569; }
    .btn-sync.linked {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    /* Main Workspace: Canvas + Split Reader */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* 2D Canvas Container (Obsidian Canvas style) */
    .canvas-container {
      flex: 1;
      position: relative;
      background-color: #0b0f19;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .canvas-container:active { cursor: grabbing; }

    /* Transform layer that gets translated and scaled */
    .canvas-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 3200px;
      height: 2400px;
      transform-origin: 0 0;
      pointer-events: none;
    }

    /* SVG Layer for Dependency Lines */
    .canvas-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Cluster Background Boxes */
    .cluster-box {
      position: absolute;
      border-radius: 16px;
      padding: 20px;
      pointer-events: auto;
      z-index: 5;
      transition: border-color 0.2s;
    }
    .cluster-val {
      background: rgba(30, 58, 138, 0.12);
      border: 2px dashed rgba(96, 165, 250, 0.3);
    }
    .cluster-lease {
      background: rgba(6, 78, 59, 0.12);
      border: 2px dashed rgba(52, 211, 153, 0.3);
    }
    .cluster-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .cluster-val .cluster-label { color: #93c5fd; }
    .cluster-lease .cluster-label { color: #6ee7b7; }

    /* Topic Node Cards on Canvas */
    .node-card {
      position: absolute;
      width: 230px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .node-card:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
      box-shadow: 0 12px 24px -4px rgba(59, 130, 246, 0.25);
    }
    .node-card.selected {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px #3b82f6, 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .node-card.completed {
      border-left: 4px solid #10b981;
    }
    .node-card.locked {
      opacity: 0.75;
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .node-badge {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .node-val .node-badge { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .node-lease .node-badge { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

    .node-status {
      font-size: 12px;
    }
    .node-title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .node-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Floating Canvas Controls */
    .canvas-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 6px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 8px;
      z-index: 40;
    }
    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    .ctrl-btn:hover { background: #334155; }

    /* Split-Screen Lesson Reader Panel */
    .reader-panel {
      width: 520px;
      background: #ffffff;
      color: #1e293b;
      border-left: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      z-index: 45;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .reader-panel.collapsed {
      width: 0;
      border-left: none;
    }

    .reader-header {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .reader-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .reader-family {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #2563eb;
    }
    .reader-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-complete {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-complete:hover { background: #e2e8f0; }
    .btn-complete.done {
      background: #ecfdf5;
      border-color: #10b981;
      color: #047857;
    }

    /* Prerequisite soft warning alert */
    .prereq-banner {
      background: #fffbeb;
      border-bottom: 1px solid #fef3c7;
      color: #92400e;
      padding: 8px 18px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reader-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    .reader-toggle-tab {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: none;
      color: var(--text);
      width: 28px;
      height: 48px;
      border-radius: 8px 0 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      z-index: 60;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <span>Topic Tree & Learning Hub</span>
      <span class="brand-badge">Real Estate Finance</span>
    </div>

    <div class="header-actions">
      <!-- Progress Bar -->
      <div class="progress-pill">
        <span id="progress-text">Mastery: 0 / 12 (0%)</span>
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- File System Access Link Button -->
      <button id="btn-link-file" class="btn btn-sync" onclick="handleLinkProgressFile()">
        <span>📁</span> <span id="link-file-label">Link progress.md</span>
      </button>

      <!-- Zoom Reset -->
      <button class="btn" onclick="fitView()">
        <span>🎯</span> <span>Fit Map</span>
      </button>
    </div>
  </header>

  <!-- Workspace: Canvas + Split Reader -->
  <div class="workspace">

    <!-- 2D Canvas Viewport -->
    <div id="canvas-container" class="canvas-container">
      <div id="canvas-world" class="canvas-world">
        <!-- SVG for Curved Dependency Lines -->
        <svg id="canvas-svg" class="canvas-svg">
          <defs>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
            </marker>
            <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
            </marker>
            <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
            </marker>
          </defs>
        </svg>

        <!-- Dynamic Cluster Boxes and Nodes will be mounted here -->
      </div>

      <!-- Canvas Zoom / Pan Controls -->
      <div class="canvas-controls">
        <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">+</button>
        <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">−</button>
        <button class="ctrl-btn" onclick="resetZoom()" title="Reset Zoom">1:1</button>
        <button class="ctrl-btn" onclick="fitView()" title="Fit View">⛶</button>
      </div>
    </div>

    <!-- Split-Screen Reader Panel -->
    <div id="reader-panel" class="reader-panel">
      <button class="reader-toggle-tab" onclick="toggleReader()" title="Toggle Reader Panel">
        <span id="toggle-icon">›</span>
      </button>

      <!-- Reader Header -->
      <div class="reader-header">
        <div class="reader-title-wrap">
          <span id="reader-family" class="reader-family">Valuation & Underwriting</span>
          <h2 id="reader-title" class="reader-title">Cash Flow</h2>
        </div>

        <div class="reader-actions">
          <button id="btn-toggle-mastery" class="btn-complete" onclick="toggleCurrentTopicMastery()">
            <span id="mastery-icon">○</span>
            <span id="mastery-label">Mark Mastered</span>
          </button>
        </div>
      </div>

      <!-- Soft Prerequisite Warning Banner (visible when needed) -->
      <div id="prereq-banner" class="prereq-banner" style="display: none;">
        <span>⚠️</span>
        <span id="prereq-message">Prerequisite recommendation: Complete foundational topics first.</span>
      </div>

      <!-- Embedded Lesson Content Frame -->
      <iframe id="reader-frame" class="reader-frame" src="topics/cash-flow.html"></iframe>
    </div>

  </div>

  <script>
    // =========================================================================
    // TOPIC CURRICULUM REGISTRY & DEPENDENCY GRAPH MANIFEST
    // =========================================================================
    const TOPICS = [
      // 1. Valuation Family
      {
        id: "cash-flow",
        title: "Cash Flow",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/cash-flow.html",
        x: 160,
        y: 200,
        prerequisites: [],
        summary: "Net spendable surplus remaining after all operating expenses and mortgage debt service."
      },
      {
        id: "real-estate-valuations",
        title: "Real Estate Valuations",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/real-estate-valuations.html",
        x: 160,
        y: 420,
        prerequisites: [],
        summary: "Income Approach, Sales Comps, and Cost Approach methodologies."
      },
      {
        id: "cap-rate",
        title: "Cap Rate",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/cap-rate.html",
        x: 520,
        y: 280,
        prerequisites: ["cash-flow", "real-estate-valuations"],
        summary: "Unleveraged pricing yield translating Net Operating Income to market asset value."
      },
      {
        id: "rent-roll",
        title: "Rent Roll Analysis",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/rent-roll.html",
        x: 520,
        y: 110,
        prerequisites: ["cash-flow"],
        summary: "Detailed audit of tenant suites, lease terms, rollover risk, and collections."
      },
      {
        id: "third-party-appraising",
        title: "3rd Party Appraising",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/third-party-appraising.html",
        x: 880,
        y: 390,
        prerequisites: ["real-estate-valuations", "cap-rate"],
        summary: "Independent MAI appraisal audits commissioned for lenders and LTV underwriting."
      },
      {
        id: "irr",
        title: "Internal Rate of Return (IRR)",
        family: "Valuation",
        familyName: "Valuation & Underwriting",
        file: "topics/irr.html",
        x: 880,
        y: 210,
        prerequisites: ["cash-flow", "cap-rate"],
        summary: "Multi-year annualized return compounding annual cash flows and exit reversion."
      },

      // 2. Leasing Family
      {
        id: "leasing-overview",
        title: "Commercial Leasing",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/leasing-overview.html",
        x: 160,
        y: 840,
        prerequisites: [],
        summary: "Full Service Gross, Modified Gross, and Triple Net (NNN) contract structures."
      },
      {
        id: "property-taxes",
        title: "Property Taxes",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/property-taxes.html",
        x: 520,
        y: 680,
        prerequisites: ["leasing-overview", "real-estate-valuations"],
        summary: "Assessment millage, purchase price reassessment shocks, and NNN pass-throughs."
      },
      {
        id: "building-usefulness",
        title: "Building Usefulness",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/building-usefulness.html",
        x: 520,
        y: 890,
        prerequisites: ["leasing-overview"],
        summary: "Functional space utility, clear heights, column grids, and dock loading aprons."
      },
      {
        id: "customer-preferences",
        title: "Customer Preferences",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/customer-preferences.html",
        x: 880,
        y: 890,
        prerequisites: ["building-usefulness"],
        summary: "Tenant ESG certifications, MERV-13 air filtration, and transit access."
      },
      {
        id: "tenant-improvements",
        title: "Tenant Improvements (TIs)",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/tenant-improvements.html",
        x: 520,
        y: 1100,
        prerequisites: ["leasing-overview", "cash-flow"],
        summary: "Upfront capital allowances, turnkey buildouts, and leasing commissions."
      },
      {
        id: "lease-timing-requirements",
        title: "Lease Timing & Delivery",
        family: "Leasing",
        familyName: "Leasing & Tenant Operations",
        file: "topics/lease-timing-requirements.html",
        x: 1200,
        y: 990,
        prerequisites: ["customer-preferences", "tenant-improvements"],
        summary: "Construction permitting, substantial completion milestones, and rent commencement."
      }
    ];

    // Clusters layout
    const CLUSTERS = [
      {
        family: "Valuation",
        title: "Valuation & Underwriting Family",
        x: 100,
        y: 50,
        width: 1060,
        height: 520,
        class: "cluster-val"
      },
      {
        family: "Leasing",
        title: "Leasing & Tenant Operations Family",
        x: 100,
        y: 620,
        width: 1380,
        height: 600,
        class: "cluster-lease"
      }
    ];

    // State
    let progress = {}; // { [id]: boolean }
    let selectedTopicId = "cash-flow";
    let fileHandle = null; // FileSystemFileHandle for progress.md

    // Canvas Pan/Zoom State
    let scale = 0.85;
    let panX = 40;
    let panY = 20;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // Elements
    const canvasContainer = document.getElementById("canvas-container");
    const canvasWorld = document.getElementById("canvas-world");
    const canvasSvg = document.getElementById("canvas-svg");
    const readerPanel = document.getElementById("reader-panel");
    const readerFrame = document.getElementById("reader-frame");
    const readerTitle = document.getElementById("reader-title");
    const readerFamily = document.getElementById("reader-family");
    const prereqBanner = document.getElementById("prereq-banner");
    const prereqMessage = document.getElementById("prereq-message");
    const btnToggleMastery = document.getElementById("btn-toggle-mastery");
    const masteryIcon = document.getElementById("mastery-icon");
    const masteryLabel = document.getElementById("mastery-label");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    function init() {
      loadLocalStorageProgress();
      renderClusters();
      renderNodes();
      renderDependencyArrows();
      applyTransform();
      selectTopic("cash-flow");
      updateProgressDisplay();

      // Canvas Drag Listeners
      canvasContainer.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node-card") || e.target.closest(".canvas-controls")) return;
        isDragging = true;
        dragStartX = e.clientX - panX;
        dragStartY = e.clientY - panY;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        applyTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Mouse Wheel Zoom
      canvasContainer.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const rect = canvasContainer.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Zoom centered around mouse
        const newScale = Math.min(Math.max(scale * zoomFactor, 0.4), 1.6);
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
        applyTransform();
      }, { passive: false });
    }

    // =========================================================================
    // CANVAS RENDERING
    // =========================================================================
    function applyTransform() {
      canvasWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function renderClusters() {
      CLUSTERS.forEach(cluster => {
        const div = document.createElement("div");
        div.className = `cluster-box ${cluster.class}`;
        div.style.left = `${cluster.x}px`;
        div.style.top = `${cluster.y}px`;
        div.style.width = `${cluster.width}px`;
        div.style.height = `${cluster.height}px`;
        div.innerHTML = `<div class="cluster-label">${cluster.title}</div>`;
        canvasWorld.appendChild(div);
      });
    }

    function renderNodes() {
      TOPICS.forEach(topic => {
        const isMastered = !!progress[topic.id];
        const isLocked = !arePrereqsMet(topic);

        const card = document.createElement("div");
        card.id = `node-${topic.id}`;
        card.className = `node-card node-${topic.family.toLowerCase()} ${isMastered ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
        card.style.left = `${topic.x}px`;
        card.style.top = `${topic.y}px`;

        const statusIcon = isMastered ? "🟢" : (isLocked ? "🔒" : "⚪");

        card.innerHTML = `
          <div class="node-header">
            <span class="node-badge">${topic.family}</span>
            <span class="node-status" id="status-${topic.id}">${statusIcon}</span>
          </div>
          <div class="node-title">${topic.title}</div>
          <div class="node-desc">${topic.summary}</div>
        `;

        card.addEventListener("click", () => selectTopic(topic.id));
        canvasWorld.appendChild(card);
      });
    }

    function renderDependencyArrows() {
      TOPICS.forEach(topic => {
        topic.prerequisites.forEach(prereqId => {
          const parent = TOPICS.find(t => t.id === prereqId);
          if (!parent) return;

          // Connect from right edge of parent to left edge of child
          const startX = parent.x + 230;
          const startY = parent.y + 45;
          const endX = topic.x;
          const endY = topic.y + 45;

          const dx = endX - startX;
          const cp1X = startX + dx * 0.5;
          const cp1Y = startY;
          const cp2X = startX + dx * 0.5;
          const cp2Y = endY;

          const markerColor = topic.family === "Valuation" ? "url(#arrow-blue)" : "url(#arrow-emerald)";
          const strokeColor = topic.family === "Valuation" ? "#60a5fa" : "#34d399";

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", `M ${startX} ${startY} C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${endX} ${endY}`);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", strokeColor);
          path.setAttribute("stroke-width", "2");
          path.setAttribute("stroke-opacity", "0.5");
          path.setAttribute("marker-end", markerColor);
          path.id = `edge-${parent.id}-${topic.id}`;

          canvasSvg.appendChild(path);
        });
      });
    }

    // =========================================================================
    // TOPIC SELECTION & READER INTERACTION
    // =========================================================================
    function arePrereqsMet(topic) {
      if (!topic.prerequisites || topic.prerequisites.length === 0) return true;
      return topic.prerequisites.every(pid => !!progress[pid]);
    }

    function selectTopic(topicId) {
      selectedTopicId = topicId;
      const topic = TOPICS.find(t => t.id === topicId);
      if (!topic) return;

      // Update Node Highlight
      document.querySelectorAll(".node-card").forEach(n => n.classList.remove("selected"));
      const nodeEl = document.getElementById(`node-${topicId}`);
      if (nodeEl) nodeEl.classList.add("selected");

      // Update Reader Info
      readerTitle.textContent = topic.title;
      readerFamily.textContent = topic.familyName;
      readerFrame.src = topic.file;

      // Update Prerequisite Warning Banner
      const prereqsMet = arePrereqsMet(topic);
      if (!prereqsMet) {
        const missing = topic.prerequisites.filter(pid => !progress[pid]).map(pid => {
          const t = TOPICS.find(item => item.id === pid);
          return t ? t.title : pid;
        });
        prereqMessage.textContent = `Suggested order: We recommend mastering "${missing.join(", ")}" first.`;
        prereqBanner.style.display = "flex";
      } else {
        prereqBanner.style.display = "none";
      }

      // Update Mastery Button State
      updateMasteryButton(!!progress[topicId]);

      // Open reader if collapsed
      if (readerPanel.classList.contains("collapsed")) {
        toggleReader();
      }
    }

    function updateMasteryButton(isDone) {
      if (isDone) {
        btnToggleMastery.className = "btn-complete done";
        masteryIcon.textContent = "✓";
        masteryLabel.textContent = "Mastered";
      } else {
        btnToggleMastery.className = "btn-complete";
        masteryIcon.textContent = "○";
        masteryLabel.textContent = "Mark Mastered";
      }
    }

    function toggleCurrentTopicMastery() {
      const isCurrentlyDone = !!progress[selectedTopicId];
      progress[selectedTopicId] = !isCurrentlyDone;

      // Update Node in DOM
      const nodeEl = document.getElementById(`node-${selectedTopicId}`);
      const statusEl = document.getElementById(`status-${selectedTopicId}`);
      if (progress[selectedTopicId]) {
        if (nodeEl) nodeEl.classList.add("completed");
        if (statusEl) statusEl.textContent = "🟢";
      } else {
        if (nodeEl) nodeEl.classList.remove("completed");
        if (statusEl) statusEl.textContent = arePrereqsMet(TOPICS.find(t => t.id === selectedTopicId)) ? "⚪" : "🔒";
      }

      // Update dependent nodes status icons
      TOPICS.forEach(t => {
        if (t.prerequisites.includes(selectedTopicId)) {
          const depStatusEl = document.getElementById(`status-${t.id}`);
          const depNodeEl = document.getElementById(`node-${t.id}`);
          const met = arePrereqsMet(t);
          if (depNodeEl) depNodeEl.classList.toggle("locked", !met);
          if (depStatusEl && !progress[t.id]) {
            depStatusEl.textContent = met ? "⚪" : "🔒";
          }
        }
      });

      updateMasteryButton(progress[selectedTopicId]);
      updateProgressDisplay();
      saveProgressToLocalStorage();
      syncWithFileIfBound();
    }

    function updateProgressDisplay() {
      const completedCount = Object.values(progress).filter(Boolean).length;
      const total = TOPICS.length;
      const pct = Math.round((completedCount / total) * 100);

      progressText.textContent = `Mastery: ${completedCount} / ${total} (${pct}%)`;
      progressBar.style.width = `${pct}%`;
    }

    function toggleReader() {
      readerPanel.classList.toggle("collapsed");
      const isCollapsed = readerPanel.classList.contains("collapsed");
      document.getElementById("toggle-icon").textContent = isCollapsed ? "‹" : "›";
    }

    // =========================================================================
    // ZOOM CONTROLS
    // =========================================================================
    function zoomIn() {
      scale = Math.min(scale * 1.2, 1.6);
      applyTransform();
    }
    function zoomOut() {
      scale = Math.max(scale / 1.2, 0.4);
      applyTransform();
    }
    function resetZoom() {
      scale = 1.0;
      applyTransform();
    }
    function fitView() {
      scale = 0.72;
      panX = 30;
      panY = 20;
      applyTransform();
    }

    // =========================================================================
    // PROGRESS STORAGE: LOCALSTORAGE + FILE SYSTEM ACCESS API
    // =========================================================================
    function loadLocalStorageProgress() {
      try {
        const saved = localStorage.getItem("teaching_material_progress");
        if (saved) {
          progress = JSON.parse(saved);
        }
      } catch (e) {
        console.warn("Could not read localStorage progress:", e);
      }
    }

    function saveProgressToLocalStorage() {
      try {
        localStorage.setItem("teaching_material_progress", JSON.stringify(progress));
      } catch (e) {
        console.warn("Could not save to localStorage:", e);
      }
    }

    async function handleLinkProgressFile() {
      if (!window.showOpenFilePicker) {
        alert("Your browser does not support the File System Access API. Progress will be safely saved in localStorage instead, and you can download progress.md anytime.");
        downloadProgressMarkdown();
        return;
      }

      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: "Markdown Progress Checklist (progress.md)",
            accept: { "text/markdown": [".md"] }
          }],
          multiple: false
        });

        fileHandle = handle;
        const file = await fileHandle.getFile();
        const text = await file.text();

        // Parse existing checkmarks from progress.md
        TOPICS.forEach(topic => {
          // Look for: - [x] **Title**
          const regex = new RegExp(`\\[(x|X)\\]\\s*\\*\\*${escapeRegex(topic.title)}\\*\\*`, "i");
          if (regex.test(text)) {
            progress[topic.id] = true;
          }
        });

        saveProgressToLocalStorage();
        updateProgressDisplay();
        renderNodesUpdate();

        // Update UI Button
        const label = document.getElementById("link-file-label");
        const btn = document.getElementById("btn-link-file");
        label.textContent = "Synced with " + file.name;
        btn.classList.add("linked");

        // Write immediately to keep in sync
        await syncWithFileIfBound();
        alert(`Successfully linked to ${file.name}! Changes will now write directly to your file.`);
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error("Error linking file:", err);
        }
      }
    }

    async function syncWithFileIfBound() {
      if (!fileHandle) return;
      try {
        const markdown = generateProgressMarkdown();
        const writable = await fileHandle.createWritable();
        await writable.write(markdown);
        await writable.close();
      } catch (e) {
        console.error("Failed to write to bound progress.md file:", e);
      }
    }

    function renderNodesUpdate() {
      TOPICS.forEach(topic => {
        const isMastered = !!progress[topic.id];
        const isLocked = !arePrereqsMet(topic);
        const nodeEl = document.getElementById(`node-${topic.id}`);
        const statusEl = document.getElementById(`status-${topic.id}`);
        if (nodeEl) {
          nodeEl.classList.toggle("completed", isMastered);
          nodeEl.classList.toggle("locked", isLocked);
        }
        if (statusEl) {
          statusEl.textContent = isMastered ? "🟢" : (isLocked ? "🔒" : "⚪");
        }
      });
      updateMasteryButton(!!progress[selectedTopicId]);
    }

    function generateProgressMarkdown() {
      const now = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      let md = `# Real Estate Mastery Progress\n\n`;
      md += `> This file tracks your learning progress across the Real Estate Valuation & Leasing curriculum.\n`;
      md += `> Last synced from Interactive Topic Tree Hub: ${now}\n\n---\n\n`;

      CLUSTERS.forEach(cluster => {
        const clusterTopics = TOPICS.filter(t => t.family === cluster.family);
        const icon = cluster.family === "Valuation" ? "📈" : "🏢";
        md += `## ${icon} ${cluster.title}\n\n`;

        clusterTopics.forEach(t => {
          const checked = progress[t.id] ? "x" : " ";
          const prereqText = t.prerequisites.length > 0 
            ? `*Prerequisites: ${t.prerequisites.join(", ")}*`
            : `*Foundational dependency*`;
          md += `- [${checked}] **${t.title}** (\`${t.file}\`) — ${prereqText}\n`;
        });
        md += `\n---\n\n`;
      });

      return md;
    }

    function downloadProgressMarkdown() {
      const md = generateProgressMarkdown();
      const blob = new Blob([md], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "progress.md";
      a.click();
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Launch
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
